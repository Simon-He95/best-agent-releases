name: FrontierHarness Dim OAuth preflight
run-name: FrontierHarness Dim OAuth preflight / ${{ inputs.label }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Pinned private source commit
        required: true
        type: string
      label:
        description: Preflight label
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Simon-He95/best-agent
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          persist-credentials: false
          path: source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: source/.nvmrc
      - name: Build the pinned relay dependency
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          export FH_ROOT="$RUNNER_TEMP/frontier"
          mkdir -p "$FH_ROOT/raw"
          python3 -m venv "$FH_ROOT/venv"
          corepack enable
          bash scripts/frontierharness/build.sh >"$FH_ROOT/raw/build.log" 2>&1
      - name: Send one Dim OAuth preflight
        env:
          FH_DIM_OAUTH_SESSION: ${{ secrets.FH_DIM_OAUTH_SESSION }}
          FH_PROFILE: short
        run: bash scripts/frontierharness/run.sh
