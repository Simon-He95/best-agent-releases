name: FrontierHarness benchmark

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact merged private source commit
        required: true
        type: string
      recipient_key:
        description: Public age key for encrypted benchmark diagnostics
        required: true
        type: string
      tasks:
        description: Optional comma-separated public task subset
        required: false
        type: string
        default: ""
      label:
        description: Unique run label
        required: false
        type: string
        default: full62

permissions:
  contents: read

concurrency:
  group: frontierharness-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Simon-He95/best-agent
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          persist-credentials: false
          path: source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: source/.nvmrc
      - name: Install benchmark dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/frontier/raw" "$RUNNER_TEMP/frontier/report"
          sudo apt-get update -qq
          sudo apt-get install -y -qq age clang
          python3 -m venv "$RUNNER_TEMP/frontier/venv"
          "$RUNNER_TEMP/frontier/venv/bin/pip" install 'harbor==0.14.0'
          corepack enable
      - name: Build the confirmed source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          export FH_ROOT="$RUNNER_TEMP/frontier"
          bash scripts/frontierharness/build.sh > "$FH_ROOT/raw/build.log" 2>&1
          printf '%s\n' "$SOURCE_SHA"
      - name: Run official DeepSeek on FrontierHarness v1.1
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FH_TASKS: ${{ inputs.tasks }}
        run: bash scripts/frontierharness/run.sh
      - name: Encrypt raw diagnostics
        if: always()
        env:
          RECIPIENT_KEY: ${{ inputs.recipient_key }}
        run: |
          test -d "$RUNNER_TEMP/frontier/raw"
          tar -C "$RUNNER_TEMP/frontier" -czf - raw | age --encrypt --recipient "$RECIPIENT_KEY" -o "$RUNNER_TEMP/frontier/report/diagnostics.tar.gz.age"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontierharness-v11-${{ inputs.label }}
          path: ${{ runner.temp }}/frontier/report/
          retention-days: 7
          if-no-files-found: error
