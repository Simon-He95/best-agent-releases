name: Diagnose Windows CPU paths
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
env:
  DIAGNOSTIC_SOURCE_SHA: ${{ inputs.source_sha }}
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select the diagnostic source commit
        run: node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('build-request.json'));r.sourceSha=process.env.DIAGNOSTIC_SOURCE_SHA;fs.writeFileSync('build-request.json',JSON.stringify(r))"
      - run: node build.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
  diagnose:
    needs: prepare
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-arm64
            runner: windows-11-arm
          - target: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select the diagnostic source commit
        run: node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('build-request.json'));r.sourceSha=process.env.DIAGNOSTIC_SOURCE_SHA;fs.writeFileSync('build-request.json',JSON.stringify(r))"
      - run: node build.mjs checkout ${{ matrix.target }}
        env:
          SOURCE_SSH_KEY: ${{ secrets.SOURCE_SSH_KEY }}
          BUILD_ENCRYPTION_KEY: ${{ secrets.BUILD_ENCRYPTION_KEY }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: source/.nvmrc
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.target == 'win32-arm64' && 'amd64_arm64' || 'x64' }}
      - name: Run traced CPU suite and encrypt its output
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ENCRYPTION_KEY: ${{ secrets.BUILD_ENCRYPTION_KEY }}
          DIAGNOSTIC_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          import fs from 'node:fs';
          import path from 'node:path';
          import {pathToFileURL} from 'node:url';
          import {seal,readRequest} from './build.mjs';
          const cwd=path.resolve('source');const log=path.join(process.env.RUNNER_TEMP,'cpu-diagnostic.log');
          const fd=fs.openSync(log,'w');const env={...process.env};delete env.GH_TOKEN;delete env.BUILD_ENCRYPTION_KEY;
          let status=0;
          for(const [command,args] of [['corepack',['enable']],['corepack',['install']],['pnpm',['install','--frozen-lockfile']],['pnpm',['typecheck']],['node',['scripts/build-cpu-supervisor.mjs']],['pnpm',['exec','vitest','run','apps/cli/test/tui-cpu-pressure.test.ts','--reporter=verbose']]]) {
            const childEnv={...env,...(args.includes('vitest')?{NODE_OPTIONS:`--import=${pathToFileURL(path.resolve('cpu-trace.mjs')).href}`}:{})};
            const result=spawnSync(command,args,{cwd,env:childEnv,shell:true,stdio:['ignore',fd,fd]});
            if(result.error||result.status!==0){status=result.status||1;break;}
          }
          fs.closeSync(fd);
          const file=`cpu-diagnostic-${process.env.DIAGNOSTIC_TARGET}.enc`;
          fs.writeFileSync(file,seal(fs.readFileSync(log),Buffer.from(process.env.BUILD_ENCRYPTION_KEY,'base64')));
          const result=spawnSync('gh',['release','upload',readRequest('build-request.json').tag,file,'--repo',process.env.GITHUB_REPOSITORY,'--clobber'],{encoding:'utf8'});
          if(result.status!==0)throw new Error('Diagnostic upload failed');
          process.exitCode=status;
          JS
