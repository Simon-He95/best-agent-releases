name: Verify native read helper
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact private source candidate commit
        required: true
        type: string
      version:
        description: Matching CLI version (no npm publication)
        required: true
        type: string
      measure_tui_cost:
        description: Run the fixed private paired TUI experiment on macOS ARM64
        required: false
        default: false
        type: boolean
      evidence_recipient_key:
        description: RSA public key for private experiment evidence
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: native-read-helper-verification
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.request.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Write isolated verification request
        shell: bash
        env:
          REQUEST_SHA: ${{ inputs.source_sha }}
          REQUEST_VERSION: ${{ inputs.version }}
        run: node -e 'require("fs").writeFileSync("build-request.json", JSON.stringify({sourceRepository:"Simon-He95/best-agent",sourceSha:process.env.REQUEST_SHA,version:process.env.REQUEST_VERSION})+"\n")'
      - id: request
        run: node build.mjs request
      - run: node build.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - target: linux-x64-gnu
            runner: ubuntu-24.04
          - target: win32-arm64
            runner: windows-11-arm
          - target: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Write isolated verification request
        shell: bash
        env:
          REQUEST_SHA: ${{ inputs.source_sha }}
          REQUEST_VERSION: ${{ inputs.version }}
        run: node -e 'require("fs").writeFileSync("build-request.json", JSON.stringify({sourceRepository:"Simon-He95/best-agent",sourceSha:process.env.REQUEST_SHA,version:process.env.REQUEST_VERSION})+"\n")'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: runner.os != 'Windows'
        with:
          repository: Simon-He95/best-agent
          ref: ${{ needs.prepare.outputs.sha }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          persist-credentials: false
          path: source
      - name: Check out Windows source with a private-key ACL
        if: runner.os == 'Windows'
        run: node build.mjs checkout ${{ matrix.target }}
        env:
          SOURCE_SSH_KEY: ${{ secrets.SOURCE_SSH_KEY }}
          BUILD_ENCRYPTION_KEY: ${{ secrets.BUILD_ENCRYPTION_KEY }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: source/.nvmrc
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.target == 'win32-arm64' && 'amd64_arm64' || 'x64' }}
      - uses: dtolnay/rust-toolchain@1.84.0
        if: runner.os != 'Windows'
      - name: Compare isolated TUI cost on a dedicated runner
        if: inputs.measure_tui_cost && matrix.target == 'darwin-arm64'
        shell: bash
        env:
          REQUEST_SHA: ${{ inputs.source_sha }}
          RECIPIENT_KEY: ${{ inputs.evidence_recipient_key }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          fs.mkdirSync('source/.tmp/tui-cost', { recursive: true });
          const result = spawnSync(process.execPath, ['source/scripts/experiments/tui-process-isolation/ci-compare.mjs'], { encoding: 'utf8', maxBuffer: 1048576 });
          fs.writeFileSync('source/.tmp/tui-cost/bootstrap.log', String(result.stdout || '') + String(result.stderr || ''));
          console.log('Private paired experiment exit:', result.status);
          process.exit(result.status === 0 ? 0 : 1);
          JS
      - name: Preserve sanitized measurements and encrypted raw evidence
        if: always() && inputs.measure_tui_cost && matrix.target == 'darwin-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: tui-cost-evidence
          path: |
            source/.tmp/tui-cost/summary.json
            source/.tmp/tui-cost/evidence.sealed.json
          retention-days: 7
          if-no-files-found: error
      - run: node source/scripts/public-distribution/build.mjs build ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ENCRYPTION_KEY: ${{ secrets.BUILD_ENCRYPTION_KEY }}
      - name: Preserve encrypted diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-diagnostics-${{ matrix.target }}
          path: output/${{ matrix.target }}.log.enc
          retention-days: 1
          if-no-files-found: ignore

  distribute:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Write isolated verification request
        shell: bash
        env:
          REQUEST_SHA: ${{ inputs.source_sha }}
          REQUEST_VERSION: ${{ inputs.version }}
        run: node -e 'require("fs").writeFileSync("build-request.json", JSON.stringify({sourceRepository:"Simon-He95/best-agent",sourceSha:process.env.REQUEST_SHA,version:process.env.REQUEST_VERSION})+"\n")'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Simon-He95/best-agent
          ref: ${{ needs.prepare.outputs.sha }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          persist-credentials: false
          path: source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: source/.nvmrc
      - run: node source/scripts/public-distribution/build.mjs verify
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ENCRYPTION_KEY: ${{ secrets.BUILD_ENCRYPTION_KEY }}
