name: Verify native read helper
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact private source candidate commit
        required: true
        type: string
      version:
        description: Matching CLI version (no npm publication)
        required: true
        type: string
      artifact:
        description: Artifact to verify
        type: choice
        default: sea
        options: [sea, rust]
      measure_tui_cost:
        description: Run the fixed private paired TUI experiment on macOS ARM64
        required: false
        default: false
        type: boolean
      evidence_recipient_key:
        description: RSA public key for private experiment evidence
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: native-read-helper-verification
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.request.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Write isolated verification request
        shell: bash
        env:
          REQUEST_SHA: ${{ inputs.source_sha }}
          REQUEST_VERSION: ${{ inputs.version }}
        run: node -e 'require("fs").writeFileSync("build-request.json", JSON.stringify({sourceRepository:"Simon-He95/best-agent",sourceSha:process.env.REQUEST_SHA,version:process.env.REQUEST_VERSION})+"\n")'
      - id: request
        run: node build.mjs request
      - run: node build.mjs prepare
        if: inputs.artifact == 'sea'
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            rust_host: aarch64-apple-darwin
          - target: darwin-x64
            runner: macos-15-intel
            rust_host: x86_64-apple-darwin
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            rust_host: aarch64-unknown-linux-gnu
          - target: linux-x64-gnu
            runner: ubuntu-24.04
            rust_host: x86_64-unknown-linux-gnu
          - target: win32-arm64
            runner: windows-11-arm
            rust_host: aarch64-pc-windows-msvc
          - target: win32-x64
            runner: windows-2025
            rust_host: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Write isolated verification request
        shell: bash
        env:
          REQUEST_SHA: ${{ inputs.source_sha }}
          REQUEST_VERSION: ${{ inputs.version }}
        run: node -e 'require("fs").writeFileSync("build-request.json", JSON.stringify({sourceRepository:"Simon-He95/best-agent",sourceSha:process.env.REQUEST_SHA,version:process.env.REQUEST_VERSION})+"\n")'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: runner.os != 'Windows'
        with:
          repository: Simon-He95/best-agent
          ref: ${{ needs.prepare.outputs.sha }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          persist-credentials: false
          path: source
      - name: Check out Windows source with a private-key ACL
        if: runner.os == 'Windows'
        run: node build.mjs checkout ${{ matrix.target }}
        env:
          SOURCE_SSH_KEY: ${{ secrets.SOURCE_SSH_KEY }}
          BUILD_ENCRYPTION_KEY: ${{ secrets.BUILD_ENCRYPTION_KEY }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: source/.nvmrc
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.target == 'win32-arm64' && 'amd64_arm64' || 'x64' }}
      - uses: dtolnay/rust-toolchain@1.84.0
        if: runner.os != 'Windows' && inputs.artifact == 'sea'
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        if: inputs.artifact == 'rust'
        with:
          toolchain: 1.98.1-${{ matrix.rust_host }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        if: inputs.artifact == 'rust'
        with:
          python-version: '3.12'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        if: inputs.artifact == 'rust'
        with:
          version: '0.17.1'
          use-cache: false
      - name: Compare isolated TUI cost on a dedicated runner
        if: inputs.artifact == 'sea' && inputs.measure_tui_cost && matrix.target == 'darwin-arm64'
        shell: bash
        env:
          REQUEST_SHA: ${{ inputs.source_sha }}
          RECIPIENT_KEY: ${{ inputs.evidence_recipient_key }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          fs.mkdirSync('source/.tmp/tui-cost', { recursive: true });
          const result = spawnSync(process.execPath, ['source/scripts/experiments/tui-process-isolation/ci-compare.mjs'], { encoding: 'utf8', maxBuffer: 1048576 });
          fs.writeFileSync('source/.tmp/tui-cost/bootstrap.log', String(result.stdout || '') + String(result.stderr || ''));
          console.log('Private paired experiment exit:', result.status);
          process.exit(result.status === 0 ? 0 : 1);
          JS
      - name: Preserve sanitized measurements and encrypted raw evidence
        if: always() && inputs.artifact == 'sea' && inputs.measure_tui_cost && matrix.target == 'darwin-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: tui-cost-evidence
          path: |
            source/.tmp/tui-cost/summary.json
            source/.tmp/tui-cost/evidence.sealed.json
          retention-days: 7
          if-no-files-found: error
      - run: node source/scripts/public-distribution/build.mjs build ${{ matrix.target }}
        if: inputs.artifact == 'sea'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ENCRYPTION_KEY: ${{ secrets.BUILD_ENCRYPTION_KEY }}
      - name: Preserve encrypted diagnostics after failure
        if: failure() && inputs.artifact == 'sea'
        uses: actions/upload-artifact@v4
        with:
          name: native-diagnostics-${{ matrix.target }}
          path: output/${{ matrix.target }}.log.enc
          retention-days: 1
          if-no-files-found: ignore
      - name: Locate the Windows MSVC linker
        if: inputs.artifact == 'rust' && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!$env:VCToolsInstallDir) { throw 'Visual Studio tools were not activated.' }
          $link = Get-Command link.exe -CommandType Application -All |
            Where-Object { $_.Source.StartsWith($env:VCToolsInstallDir, [StringComparison]::OrdinalIgnoreCase) } |
            Select-Object -First 1
          if (!$link) { throw 'MSVC link.exe is missing from the developer environment.' }
          "RUST_MSVC_BIN=$([IO.Path]::GetDirectoryName($link.Source))" >> $env:GITHUB_ENV
      - name: Verify the installed Rust archive
        if: inputs.artifact == 'rust'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            msvc_bin=$(cygpath -u "$RUST_MSVC_BIN")
            export PATH="$msvc_bin:$PATH"
            test "$(type -P link.exe)" = "$msvc_bin/link.exe"
          fi
          node source/scripts/public-distribution/build.mjs rust-verify ${{ matrix.target }}
        env:
          BUILD_ENCRYPTION_KEY: ${{ secrets.BUILD_ENCRYPTION_KEY }}
          GH_TOKEN: ${{ github.token }}
          RUST_CLASSIC_SSH_KEY: ${{ secrets.RUST_CLASSIC_SSH_KEY }}
          RUSTUP_TOOLCHAIN: 1.98.1-${{ matrix.rust_host }}
      - name: Preserve encrypted Rust archives and verification evidence
        if: always() && inputs.artifact == 'rust'
        uses: actions/upload-artifact@v4
        with:
          name: rust-verification-${{ matrix.target }}
          path: |
            output/rust-${{ matrix.target }}.archive.enc
            output/rust-${{ matrix.target }}.metadata.enc
            output/rust-${{ matrix.target }}.log.enc
            output/${{ matrix.target }}.log.enc
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

  distribute:
    needs: [prepare, build]
    if: inputs.artifact == 'sea'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Write isolated verification request
        shell: bash
        env:
          REQUEST_SHA: ${{ inputs.source_sha }}
          REQUEST_VERSION: ${{ inputs.version }}
        run: node -e 'require("fs").writeFileSync("build-request.json", JSON.stringify({sourceRepository:"Simon-He95/best-agent",sourceSha:process.env.REQUEST_SHA,version:process.env.REQUEST_VERSION})+"\n")'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Simon-He95/best-agent
          ref: ${{ needs.prepare.outputs.sha }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          persist-credentials: false
          path: source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: source/.nvmrc
      - run: node source/scripts/public-distribution/build.mjs verify
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ENCRYPTION_KEY: ${{ secrets.BUILD_ENCRYPTION_KEY }}
