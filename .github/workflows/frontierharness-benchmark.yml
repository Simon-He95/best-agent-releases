name: FrontierHarness diagnostic isolation pilot
run-name: FrontierHarness v1.1 / ${{ inputs.label }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact private source commit
        required: true
        type: string
      recipient_key:
        description: Public age key for encrypted diagnostics
        required: true
        type: string
      tasks:
        description: Comma-separated subset of the diagnostic isolation pilot
        required: false
        type: string
        default: ""
      label:
        description: Unique run label
        required: false
        type: string
        default: oauth57

permissions:
  contents: read

concurrency:
  group: frontierharness-paired-${{ inputs.source_sha }}-${{ inputs.label }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: plan
        name: Plan the task pairs
        env:
          FH_TASKS: ${{ inputs.tasks }}
        run: python3 scripts/frontierharness/plan-pairs.py

  benchmark:
    name: ${{ matrix.profile }} / ${{ matrix.task }}
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Simon-He95/best-agent
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          persist-credentials: false
          path: source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: source/.nvmrc
      - name: Install benchmark dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/frontier/raw" "$RUNNER_TEMP/frontier/report"
          sudo apt-get update -qq
          sudo apt-get install -y -qq age clang
          python3 -m venv "$RUNNER_TEMP/frontier/venv"
          "$RUNNER_TEMP/frontier/venv/bin/pip" install 'harbor==0.14.0'
          corepack enable
      - name: Build the pinned profile
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          FH_PROFILE: ${{ matrix.profile }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          export FH_ROOT="$RUNNER_TEMP/frontier"
          bash scripts/frontierharness/build.sh >"$FH_ROOT/raw/build.log" 2>&1
          node scripts/frontierharness/prepare-profile.mjs >"$FH_ROOT/raw/profile.log" 2>&1
          printf '%s\n' "$SOURCE_SHA"
          uname -m
      - name: Run Dim OAuth on FrontierHarness v1.1
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          FH_DIM_OAUTH_SESSION: ${{ secrets.FH_DIM_OAUTH_SESSION }}
          FH_PROFILE: ${{ matrix.profile }}
          FH_TASKS: ${{ matrix.task }}
        run: bash scripts/frontierharness/run.sh
      - name: Preserve the task score
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: score-${{ matrix.profile }}-${{ matrix.task }}
          path: |
            ${{ runner.temp }}/frontier/report/profile.json
            ${{ runner.temp }}/frontier/report/summary.json
            ${{ runner.temp }}/frontier/report/tasks.csv
          retention-days: 14
          if-no-files-found: warn
      - name: Encrypt raw diagnostics
        if: always()
        env:
          RECIPIENT_KEY: ${{ inputs.recipient_key }}
        run: |
          test -d "$RUNNER_TEMP/frontier/raw"
          tar -C "$RUNNER_TEMP/frontier" -czf - raw | age --encrypt --recipient "$RECIPIENT_KEY" -o "$RUNNER_TEMP/frontier/report/diagnostics.tar.gz.age"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostics-${{ matrix.profile }}-${{ matrix.task }}
          path: ${{ runner.temp }}/frontier/report/diagnostics.tar.gz.age
          retention-days: 14
          if-no-files-found: error
