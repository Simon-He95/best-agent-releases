name: FrontierHarness timeout cleanup smoke
run-name: ${{ inputs.label }}

on:
  workflow_dispatch:
    inputs:
      label:
        description: Smoke run label
        required: true
        type: string

permissions:
  contents: read

jobs:
  deadline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Measure outer cancellation and scoped cleanup
        run: python3 scripts/frontierharness/timeout-cleanup-smoke.py "$RUNNER_TEMP/timeout-cleanup.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: timeout-cleanup-receipts
          path: ${{ runner.temp }}/timeout-cleanup.json
          if-no-files-found: error
          retention-days: 14
