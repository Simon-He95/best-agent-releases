name: FrontierHarness benchmark

# Runs the published FrontierHarness task set through Harbor on an amd64 runner.
# The task images are linux/amd64, so running here rather than on the developer's
# arm64 machine is what makes wall time meaningful.
#
# The CLI under test is built from the source commit, installed into a Node runtime
# on the runner, and bind-mounted read-only into every trial. Setup therefore needs
# no network: task images are not required to carry a Node, and their setup phase is
# not guaranteed egress to a package registry. This is the part a golden checkpoint
# plays in the official flow.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact private source commit to benchmark
        required: true
        type: string
      verify_only:
        description: Verify the packaged CLI with a local fake model
        required: true
        type: boolean
        default: true
      tasks:
        description: Explicit comma-separated task subset for a model run
        required: false
        type: string
        default: ""
      model:
        description: provider/model passed to the adapter
        required: false
        type: string
        default: deepseek/deepseek-flash
      attempts:
        description: Attempts per task; the published board scores the first valid one
        required: false
        type: string
        default: "1"
      concurrency:
        description: Concurrent trials
        required: false
        type: string
        default: "3"

permissions:
  contents: read

# Never cancel mid-run: a cancelled trial still holds a container, and its spend
# is already committed.
concurrency:
  group: frontierharness-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    # GitHub kills a hosted job at 6 hours regardless; the 62-task set at three
    # concurrent trials needs about four, and this bound makes an overrun
    # deterministic instead of silent.
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Require explicit tasks for model runs
        if: ${{ !inputs.verify_only && inputs.tasks == '' }}
        run: |
          echo "Model runs on this workflow require an explicit task subset." >&2
          exit 2

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Simon-He95/best-agent
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 0

      - name: Record the exact benchmarked commit
        run: |
          git rev-parse HEAD
          git log -1 --format='%H %s'
          uname -m
          docker version --format '{{.Server.Version}}'
          df -h /

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: |
          npm install --global pnpm@10.34.9
          pnpm --version
          node --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the CLI and prepare its runtime
        run: |
          node scripts/pack-cli-node.mjs .tmp/bench-cli-node
          tarball=$(ls .tmp/bench-cli-node/*.tgz)
          echo "packed $tarball"
          sha256sum "$tarball"
          runtime="$RUNNER_TEMP/ba-runtime"
          mkdir -p "$runtime"
          # The runner's Node, laid out the way a global install expects, so the
          # trial mount carries both the interpreter and the CLI.
          cp -a "$(dirname "$(dirname "$(command -v node)")")/." "$runtime/"
          npm install --global --prefix "$runtime" --no-fund --no-audit "$tarball"
          "$runtime/bin/best-agent" --version
          "$runtime/bin/best-agent-workspace-read-helper" --help >/dev/null 2>&1 || true
          echo "BENCH_CLI_RUNTIME=$runtime" >> "$GITHUB_ENV"

      - name: Verify service after CLI exit
        if: ${{ inputs.verify_only }}
        run: |
          export FRONTIERHARNESS_TEST_CLI="$BENCH_CLI_RUNTIME/bin/best-agent"
          export PATH="$BENCH_CLI_RUNTIME/bin:$PATH"
          pnpm exec vitest run apps/cli/test/v3-run-released-process.e2e.test.ts

      - name: Install Harbor
        if: ${{ !inputs.verify_only }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install 'harbor==0.14.0'
          harbor --version
          python3 --version

      - name: Run the benchmark subset
        if: ${{ !inputs.verify_only }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
          BENCH_SOURCE_SHA: ${{ inputs.source_sha }}
          BENCH_MODEL: ${{ inputs.model }}
          BENCH_TASKS: ${{ inputs.tasks }}
          BENCH_ATTEMPTS: ${{ inputs.attempts }}
          BENCH_CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          python3 benchmarks/frontierharness/run_benchmark.py \
            --output "runs/$BENCH_SOURCE_SHA" \
            --model "$BENCH_MODEL" \
            --tasks "$BENCH_TASKS" \
            --attempts "$BENCH_ATTEMPTS" \
            --concurrency "$BENCH_CONCURRENCY" \
            --cli-runtime "$BENCH_CLI_RUNTIME"

      - name: Recover completed trials if the runner was interrupted
        if: ${{ always() && !inputs.verify_only }}
        env:
          BENCH_SOURCE_SHA: ${{ inputs.source_sha }}
          BENCH_MODEL: ${{ inputs.model }}
          BENCH_ATTEMPTS: ${{ inputs.attempts }}
        run: |
          output="runs/$BENCH_SOURCE_SHA"
          if [ -d "$output/jobs" ] && [ ! -f "$output/task-results.csv" ]; then
            python3 benchmarks/frontierharness/run_benchmark.py \
              --output "$output" --model "$BENCH_MODEL" --attempts "$BENCH_ATTEMPTS" --report-only
          fi

      - name: Upload task results
        if: ${{ always() && !inputs.verify_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontierharness-task-results-${{ inputs.source_sha }}
          path: runs/${{ inputs.source_sha }}/task-results.csv
          retention-days: 30
          if-no-files-found: error
